spring:
  application:
    name: dorumdorum

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  
  datasource:
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    url: jdbc:tc:postgresql:16:///testdb
    username: test
    password: test

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
    open-in-view: false

  data:
    mongodb:
    redis:
      host: localhost
      port: 6379

  mail:
    host: localhost
    port: 25
    username: test
    password: test
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false
      mail.smtp.timeout: 5000

jwt:
  key: test-secret-key-for-jwt-token-generation-minimum-256-bits-required-for-hs256-algorithm
  access:
    expiration: 3600000
  refresh:
    expiration: 604800000

exclude-auth-path-patterns:
  paths: []

exclude-blacklist-path-patterns:
  paths: []

exclude-whitelist-path-patterns:
  paths: []

include-email-domains:
  domains:
    - gachon.ac.kr

firebase:
  service-account:
    path: dummy-firebase-config.json

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.data.mongodb: DEBUG
