spring:
  datasource:
    username: ${RDB_USERNAME}
    url: ${RDB_URL}
    password: ${RDB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
    mongodb:
      uri: ${MONGODB_URI}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

jwt:
  key: ${JWT_KEY}
  access:
    expiration: ${JWT_ACCESS_EXPIRATION}
  refresh:
    expiration: ${JWT_REFRESH_EXPIRATION}

logging:
  policy:
    include-stack-trace: false
  level:
    root: INFO
    com.project.dorumdorum: INFO
    org.hibernate.SQL: WARN
    org.springframework: WARN

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

firebase:
  service-account:
    path: ${FIREBASE_SERVICE_ACCOUNT_PATH}

alert:
  discord:
    webhook-url: ${DISCORD_WEBHOOK}
