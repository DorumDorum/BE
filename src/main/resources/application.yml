spring:
  application:
    name: dorumdorum
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database: mysql
    database-platform: org.hibernate.dialect.MySQL8Dialect
    open-in-view: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.timeout: 5000

logging:
  masking:
    sensitive-patterns:
      - password
      - accesstoken
      - refreshtoken
      - verificationcode
      - apikey
      - apisecret
      - email
      - phone
      - phonenumber
      - fcmtoken
      - address
      - username
      - token
  policy:
    max-arg-length: 200
    max-result-length: 300
    include-stack-trace: false

exclude-auth-path-patterns:
  paths:
    - path-pattern: /ws/**
      method: GET
    - path-pattern: /ws-native
      method: GET
    - path-pattern: /ws-native/**
      method: GET
    - path-pattern: /api/users/sign-up
      method: POST
    - path-pattern: /api/users/login
      method: POST
    - path-pattern: /api/email/send
      method: POST
    - path-pattern: /api/email/verify
      method: POST
    - path-pattern: /swagger-ui.html
      method: GET
    - path-pattern: /swagger-ui/index.html
      method: GET
    - path-pattern: /swagger-ui/**
      method: GET
    - path-pattern: /v3/api-docs
      method: GET
    - path-pattern: /v3/api-docs/swagger-config
      method: GET
    - path-pattern: /webjars
      method: GET
    - path-pattern: /actuator/**
      method: GET
    - path-pattern: /api/rooms
      method: GET
    - path-pattern: /api/rooms/**
      method: GET
    - path-pattern: /api/calendar/events
      method: GET
    - path-pattern: /api/notices
      method: GET

exclude-blacklist-path-patterns:
  paths:
    - path-pattern: /api/users/sign-up
      method: POST
    - path-pattern: /api/users/login
      method: POST
    - path-pattern: /api/email/send
      method: POST
    - path-pattern: /api/email/verify
      method: POST
    - path-pattern: /swagger-ui.html
      method: GET
    - path-pattern: /swagger-ui/index.html
      method: GET
    - path-pattern: /swagger-ui/**
      method: GET
    - path-pattern: /v3/api-docs
      method: GET
    - path-pattern: /v3/api-docs/swagger-config
      method: GET
    - path-pattern: /webjars
      method: GET
    - path-pattern: /actuator/**
      method: GET
    - path-pattern: /api/rooms
      method: GET
    - path-pattern: /api/rooms/**
      method: GET
    - path-pattern: /api/calendar/events
      method: GET
    - path-pattern: /api/notices
      method: GET

exclude-whitelist-path-patterns:
  paths:
    - path-pattern: /api/users/sign-up
      method: POST
    - pathPattern: /api/users/login
      method: POST
    - path-pattern: /api/users/logout
      method: DELETE
    - path-pattern: /api/token/reissue
      method: POST
    - path-pattern: /api/email/send
      method: POST
    - path-pattern: /api/email/verify
      method: POST
    - path-pattern: /swagger-ui.html
      method: GET
    - path-pattern: /swagger-ui/index.html
      method: GET
    - path-pattern: /swagger-ui/**
      method: GET
    - path-pattern: /v3/api-docs
      method: GET
    - path-pattern: /v3/api-docs/swagger-config
      method: GET
    - path-pattern: /webjars
      method: GET
    - path-pattern: /actuator/**
      method: GET

springdoc:
  swagger-ui:
    groups-order: DESC
    tags-sorter: alpha
    operations-sorter: method
  paths-to-match:
    - /api/**

include-email-domains:
  domains:
    - gachon.ac.kr

management:
  metrics:
    tags:
      application: ${spring.application.name:dorumdorum}
    export:
      prometheus:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized