name: cicd

on:
  pull_request:
    branches: ["production", "develop"]
  push:
    branches: ["production", "develop"]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew test --no-daemon

  docker-build-and-push:
    name: Docker Build and Push
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/production'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/dorumdorum-be
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy to GCE
    runs-on: ubuntu-latest
    needs: docker-build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/dorumdorum-be:latest
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          BE_ENV_FILE_B64: ${{ secrets.BE_ENV_FILE_B64 }}
          FIREBASE_SERVICE_ACCOUNT_B64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_B64 }}
          CONTAINER_NAME: dorumdorum-be
          DEPLOY_PATH: ~/dorumdorum
        with:
          host: ${{ secrets.GCE_HOST }}
          username: ${{ secrets.GCE_USER }}
          key: ${{ secrets.GCE_SSH_KEY }}
          port: ${{ secrets.GCE_SSH_PORT }}
          envs: IMAGE,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,BE_ENV_FILE_B64,FIREBASE_SERVICE_ACCOUNT_B64,CONTAINER_NAME,DEPLOY_PATH
          script_stop: true
          script: |
            set -e

            mkdir -p "$DEPLOY_PATH"
            cd "$DEPLOY_PATH"

            echo "$BE_ENV_FILE_B64" | base64 -d > .env
            chmod 600 .env
            echo "$FIREBASE_SERVICE_ACCOUNT_B64" | base64 -d > firebase-service-account.json
            chmod 600 firebase-service-account.json

            cat > docker-compose.yml <<EOF
            services:
              redis:
                image: redis:7-alpine
                container_name: dorumdorum-redis
                restart: unless-stopped
                command: ["redis-server", "--appendonly", "yes"]
                volumes:
                  - redis-data:/data
                healthcheck:
                  test: ["CMD", "redis-cli", "ping"]
                  interval: 10s
                  timeout: 3s
                  retries: 5

              be:
                image: ${IMAGE}
                container_name: ${CONTAINER_NAME}
                restart: unless-stopped
                depends_on:
                  redis:
                    condition: service_healthy
                ports:
                  - "8080:8080"
                env_file:
                  - .env
                environment:
                  REDIS_HOST: redis
                  REDIS_PORT: 6379
                  FIREBASE_SERVICE_ACCOUNT_PATH: /app/firebase-service-account.json
                volumes:
                  - ./firebase-service-account.json:/app/firebase-service-account.json:ro
            volumes:
              redis-data:
            EOF

            docker login -u "$DOCKERHUB_USERNAME" -p "$DOCKERHUB_TOKEN"
            docker-compose --version
            docker-compose pull
            docker-compose up -d --remove-orphans

            docker image prune -af --filter "until=168h"
