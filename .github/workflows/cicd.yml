name: cicd

on:
  pull_request:
    branches: ["production", "develop"]
  push:
    branches: ["production", "develop"]
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    if: false  # temporary: disable CI jobs

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew test --no-daemon

  docker-build-and-push:
    name: Docker Build and Push
    runs-on: ubuntu-latest
    needs: test
    if: false  # temporary: disable CI jobs

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/dorumdorum-be
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy to GCE
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/production')

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/dorumdorum-be:latest
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT_B64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_B64 }}
          RDB_USERNAME: ${{ secrets.RDB_USERNAME }}
          RDB_URL: ${{ secrets.RDB_URL }}
          RDB_PASSWORD: ${{ secrets.RDB_PASSWORD }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JWT_KEY: ${{ secrets.JWT_KEY }}
          JWT_ACCESS_EXPIRATION: ${{ secrets.JWT_ACCESS_EXPIRATION }}
          JWT_REFRESH_EXPIRATION: ${{ secrets.JWT_REFRESH_EXPIRATION }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          CONTAINER_NAME: dorumdorum-be
        with:
          host: ${{ secrets.GCE_HOST }}
          username: ${{ secrets.GCE_USER }}
          key: ${{ secrets.GCE_SSH_KEY }}
          port: ${{ secrets.GCE_SSH_PORT }}
          timeout: 60s
          command_timeout: 30m
          debug: true
          envs: IMAGE,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,FIREBASE_SERVICE_ACCOUNT_B64,RDB_USERNAME,RDB_URL,RDB_PASSWORD,MONGODB_URI,JWT_KEY,JWT_ACCESS_EXPIRATION,JWT_REFRESH_EXPIRATION,SMTP_USERNAME,SMTP_PASSWORD,CONTAINER_NAME
          script_stop: true
          script: |
            set -e

            [ -n "$FIREBASE_SERVICE_ACCOUNT_B64" ] || { echo "Missing secret: FIREBASE_SERVICE_ACCOUNT_B64"; exit 1; }
            [ -n "$DOCKERHUB_USERNAME" ] || { echo "Missing secret: DOCKERHUB_USERNAME"; exit 1; }
            [ -n "$DOCKERHUB_TOKEN" ] || { echo "Missing secret: DOCKERHUB_TOKEN"; exit 1; }
            [ -n "$RDB_USERNAME" ] || { echo "Missing secret: RDB_USERNAME"; exit 1; }
            [ -n "$RDB_URL" ] || { echo "Missing secret: RDB_URL"; exit 1; }
            [ -n "$RDB_PASSWORD" ] || { echo "Missing secret: RDB_PASSWORD"; exit 1; }
            [ -n "$MONGODB_URI" ] || { echo "Missing secret: MONGODB_URI"; exit 1; }
            [ -n "$JWT_KEY" ] || { echo "Missing secret: JWT_KEY"; exit 1; }
            [ -n "$JWT_ACCESS_EXPIRATION" ] || { echo "Missing secret: JWT_ACCESS_EXPIRATION"; exit 1; }
            [ -n "$JWT_REFRESH_EXPIRATION" ] || { echo "Missing secret: JWT_REFRESH_EXPIRATION"; exit 1; }
            [ -n "$SMTP_USERNAME" ] || { echo "Missing secret: SMTP_USERNAME"; exit 1; }
            [ -n "$SMTP_PASSWORD" ] || { echo "Missing secret: SMTP_PASSWORD"; exit 1; }

            DEPLOY_PATH="${HOME}/dorumdorum"

            mkdir -p "$DEPLOY_PATH"
            cd "$DEPLOY_PATH"

            printf '%s\n' \
              "SPRING_PROFILES_ACTIVE=prod" \
              "RDB_USERNAME=$RDB_USERNAME" \
              "RDB_URL=$RDB_URL" \
              "RDB_PASSWORD=$RDB_PASSWORD" \
              "MONGODB_URI=$MONGODB_URI" \
              "JWT_KEY=$JWT_KEY" \
              "JWT_ACCESS_EXPIRATION=$JWT_ACCESS_EXPIRATION" \
              "JWT_REFRESH_EXPIRATION=$JWT_REFRESH_EXPIRATION" \
              "SMTP_USERNAME=$SMTP_USERNAME" \
              "SMTP_PASSWORD=$SMTP_PASSWORD" > .env
            chmod 600 .env

            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_B64" | base64 -d > firebase-service-account.json
            chmod 600 firebase-service-account.json

            docker info >/dev/null 2>&1 || {
              echo "Docker socket permission denied for current deploy user."
              echo "This user must be in docker group before running CI/CD."
              exit 1
            }

            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

            docker pull redis:7-alpine
            docker pull "$IMAGE"

            docker network inspect dorumdorum-net >/dev/null 2>&1 || docker network create dorumdorum-net

            docker stop dorumdorum-redis >/dev/null 2>&1 || true
            docker rm dorumdorum-redis >/dev/null 2>&1 || true
            docker stop "$CONTAINER_NAME" >/dev/null 2>&1 || true
            docker rm "$CONTAINER_NAME" >/dev/null 2>&1 || true

            docker run -d \
              --name dorumdorum-redis \
              --restart unless-stopped \
              --network dorumdorum-net \
              -v redis-data:/data \
              redis:7-alpine \
              redis-server --appendonly yes

            docker run -d \
              --name "$CONTAINER_NAME" \
              --restart unless-stopped \
              --network dorumdorum-net \
              -p 8080:8080 \
              --env-file .env \
              -e REDIS_HOST=dorumdorum-redis \
              -e REDIS_PORT=6379 \
              -e FIREBASE_SERVICE_ACCOUNT_PATH=/app/firebase-service-account.json \
              -v "$DEPLOY_PATH/firebase-service-account.json:/app/firebase-service-account.json:ro" \
              "$IMAGE"

            docker image prune -af --filter "until=168h"
