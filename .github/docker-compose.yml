services:
  redis:
    image: redis:7-alpine
    container_name: dorumdorum-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    networks:
      - dorumdorum-net

  backend:
    image: ${BACKEND_IMAGE:-koungq/dorumdorum-be:latest}
    container_name: ${CONTAINER_NAME:-dorumdorum-be}
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./firebase-service-account.json:/app/firebase-service-account.json:ro
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - dorumdorum-net

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: dorumdorum-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - dorumdorum-net

  grafana:
    image: grafana/grafana:11.2.0
    container_name: dorumdorum-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - dorumdorum-net

volumes:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  dorumdorum-net:
    external: true
