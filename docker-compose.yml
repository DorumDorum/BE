services:
  postgres:
    image: postgres:16-alpine
    container_name: dorumdorum-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-dorumdorum}
      - POSTGRES_USER=${RDB_USERNAME}
      - POSTGRES_PASSWORD=${RDB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RDB_USERNAME} -d ${POSTGRES_DB:-dorumdorum}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - dorumdorum-net

  redis:
    image: redis:7-alpine
    container_name: dorumdorum-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    networks:
      - dorumdorum-net

  backend:
    image: ${BACKEND_IMAGE:-koungq/dorumdorum-be:pinpoint}
    container_name: ${CONTAINER_NAME:-dorumdorum-be}
    ports:
      - "8080:8080"
    stop_grace_period: 45s
    env_file:
      - ./secrets/.env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PINPOINT_COLLECTOR_IP=pinpoint-collector
      - PINPOINT_APPLICATION_NAME=dorumdorum
      - PINPOINT_AGENT_ID=${PINPOINT_AGENT_ID:-dorumdorum-backend-${HOSTNAME}}
      - PINPOINT_AGENT_NAME=${PINPOINT_AGENT_NAME:-dorumdorum-be}
    volumes:
      - ./secrets/firebase-service-account.json:/app/firebase-service-account.json:ro
      - ./logs/jfr:/app/logs/jfr
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      pinpoint-collector:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 16G
    restart: unless-stopped
    networks:
      - dorumdorum-net

  zoo1:
    image: zookeeper:3.4.13
    container_name: zoo1
    ports:
      - "2181:2181"
    environment:
      - ZOO_MY_ID=1
    volumes:
      - zookeeper_data:/data
    restart: unless-stopped
    networks:
      dorumdorum-net:
        aliases:
          - zoo2
          - zoo3

  pinpoint-hbase:
    image: pinpointdocker/pinpoint-hbase:2.5.4
    container_name: pinpoint-hbase
    hostname: pinpoint-hbase
    depends_on:
      - zoo1
    networks:
      - dorumdorum-net
    ports:
      - "16000:16000"
      - "16010:16010"
      - "16020:16020"
      - "16030:16030"
    volumes:
      - hbase_data:/home/pinpoint/hbase
    restart: unless-stopped

  pinpoint-collector:
    image: pinpointdocker/pinpoint-collector:2.5.4
    container_name: pinpoint-collector
    depends_on:
      - pinpoint-hbase
    networks:
      - dorumdorum-net
    environment:
      - SPRING_PROFILES_ACTIVE=release
      - PINPOINT_ZOOKEEPER_ADDRESS=zoo1:2181
      - HBASE_HOST=zoo1
      - HBASE_PORT=2181
    ports:
      - "9991:9991"
      - "9992:9992"
      - "9993:9993"
      - "9994:9994"
      - "9995:9995/udp"
      - "9996:9996/udp"
    restart: unless-stopped

  pinpoint-web:
    image: pinpointdocker/pinpoint-web:2.5.4
    container_name: pinpoint-web
    env_file:
      - ./secrets/.env
    depends_on:
      - pinpoint-hbase
    networks:
      - dorumdorum-net
    environment:
      - SPRING_PROFILES_ACTIVE=release
      - PINPOINT_ZOOKEEPER_ADDRESS=zoo1:2181
      - HBASE_HOST=zoo1
      - HBASE_PORT=2181
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
    ports:
      - "8079:8080"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: dorumdorum-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - dorumdorum-net

  grafana:
    image: grafana/grafana:11.2.0
    container_name: dorumdorum-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - dorumdorum-net

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  hbase_data:
  zookeeper_data:

networks:
  dorumdorum-net:
    external: true
